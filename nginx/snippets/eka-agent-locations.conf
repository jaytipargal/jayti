# Shared routes for agent.jaytipargal.tech (primary) and agent.urgaa.in (legacy alias).
# Source of truth: jaytipargal/jayti nginx/snippets/eka-agent-locations.conf

client_max_body_size 50M;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 60s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Jayti Retrieval API (FAISS + MiniLM). Authenticates per device itself.
location /retrieve/ {
    proxy_pass http://127.0.0.1:8444/;
}

# EKA retrieval server. Search returns knowledge-base content, so it needs the key.
location = /retrieval/health {
    proxy_pass http://127.0.0.1:8100/health;
}
location /retrieval/ {
    if ($eka_agent_key_ok = 0) { return 401 "{\"detail\":\"missing or invalid X-API-Key\"}\n"; }
    proxy_pass http://127.0.0.1:8100/;
}

# EKA agent (RAG + Claude). Every query spends Anthropic credits, so it needs the key.
location = /agent/health {
    proxy_pass http://127.0.0.1:8000/health;
}
location /agent/ {
    if ($eka_agent_key_ok = 0) { return 401 "{\"detail\":\"missing or invalid X-API-Key\"}\n"; }
    proxy_pass http://127.0.0.1:8000/;
    proxy_buffering off;
}

location = /eka_client.sh {
    alias /opt/eka-agent/eka_client.sh;
    default_type application/x-sh;
    add_header Content-Disposition "attachment";
}
location = /install.sh {
    alias /opt/eka-agent/install.sh;
    default_type application/x-sh;
}

# Jayti Hub: device ingestion (/ingest, /pull, /pull/mark, /status, /healthz, /register_device).
location / {
    proxy_pass http://127.0.0.1:8443;
}
