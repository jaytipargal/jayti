server {
    listen 80;
    listen [::]:80;
    server_name agent.urgaa.in;

    client_max_body_size 50M;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.urgaa.in;

    ssl_certificate /etc/letsencrypt/live/agent.urgaa.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.urgaa.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # ── EKA Retrieval Server (FAISS search + RAG context) ──
    location /retrieval/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── EKA Agent Server (RAG + Claude LLM) ──
    location /agent/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # ── Client script download ──
    location = /eka_client.sh {
        alias /opt/eka-agent/eka_client.sh;
        default_type application/x-sh;
        add_header Content-Disposition "attachment";
    }

    # ── Universal installer ──
    location = /install.sh {
        alias /opt/eka-agent/install.sh;
        default_type application/x-sh;
    }

    # ── Existing ingestion API (default) ──
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}